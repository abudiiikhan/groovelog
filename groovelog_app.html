<script>
// Generate PNG icon via canvas for iOS home screen
window.addEventListener('load',function(){
  try{
    var c=document.createElement('canvas');
    c.width=180;c.height=180;
    var ctx=c.getContext('2d');
    // Background
    ctx.fillStyle='#0d0d0d';
    roundRect(ctx,0,0,180,180,35);
    ctx.fill();
    // Vinyl outer
    ctx.beginPath();ctx.arc(90,90,76,0,Math.PI*2);
    ctx.fillStyle='#111111';ctx.fill();
    ctx.strokeStyle='#ff3cac';ctx.lineWidth=3;ctx.stroke();
    // Groove rings
    [66,56,46,36].forEach(function(r){
      ctx.beginPath();ctx.arc(90,90,r,0,Math.PI*2);
      ctx.strokeStyle='rgba(255,60,172,0.35)';ctx.lineWidth=1;ctx.stroke();
    });
    // Center label
    ctx.beginPath();ctx.arc(90,90,28,0,Math.PI*2);
    ctx.fillStyle='#ff3cac';ctx.fill();
    // G text
    ctx.fillStyle='#0d0d0d';
    ctx.font='900 34px "Arial Black",Arial';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('G',88,92);
    // Needle
    ctx.beginPath();ctx.moveTo(141,27);ctx.lineTo(107,66);
    ctx.strokeStyle='#ff3cac';ctx.lineWidth=3;
    ctx.lineCap='round';ctx.stroke();
    ctx.beginPath();ctx.arc(107,66,4.5,0,Math.PI*2);
    ctx.fillStyle='#ff3cac';ctx.fill();
    // Set as apple touch icon
    var link=document.querySelector("link[rel='apple-touch-icon']");
    if(link) link.href=c.toDataURL('image/png');
  } catch(e){}
  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
  }
});
</script>

/* ─── API LAYER ───────────────────────────────────────────────
   🔌 Set API_BASE to your backend URL when running the server.
   When API_BASE is null, the app uses local mock data.
   
   To enable: change null to 'http://localhost:3001'
   ─────────────────────────────────────────────────────────── */
const API_BASE = 'https://groovelog-production.up.railway.app'; // Railway backend

async function api(path, opts={}) {
  if (!API_BASE) return null;
  try {
    const res = await fetch(API_BASE + path, {
      headers: { 'Content-Type': 'application/json' },
      ...opts,
    });
    if (!res.ok) return null;
    return res.json();
  } catch { return null; }
}

/* Search: tries API first, falls back to local filter */
async function searchMusic(q, albums) {
  const data = await api(`/api/search?q=${encodeURIComponent(q)}&type=release`);
  if (data?.results?.length) {
    return data.results.map(r => ({
      id: r.mbid, mbid: r.mbid,
      title: r.title, artist: r.artist, year: parseInt(r.year)||0,
      tracks: r.tracks||12, genre: 'Unknown', color: '#555',
      avg: r.avg||null, myScore: r.myScore||null, myReview: r.myReview||'',
      ratings: r.ratings||0, coverUrl: r.coverUrl,
    }));
  }
  return albums.filter(a =>
    a.title.toLowerCase().includes(q.toLowerCase()) ||
    a.artist.toLowerCase().includes(q.toLowerCase())
  );
}

/* Get album: tries API for fresh data + cover art */
async function getAlbumDetail(mbid) {
  return api(`/api/album/${mbid}`);
}

/* Save rating: posts to API, also updates local state */
async function postRating(mbid, type, score, review) {
  return api('/api/rate', {
    method: 'POST',
    body: JSON.stringify({ mbid, type, score, review, userId: 1 }),
  });
}

/* Get cover art URL for an album */
function CoverArt({ album, size=44, radius=6 }) {
  const [url, setUrl] = useState(album.coverUrl || null);
  useEffect(() => {
    if (!url && album.mbid && API_BASE) {
      fetch(`${API_BASE}/api/cover/${album.mbid}`)
        .then(r=>r.ok?r.json():null)
        .then(d=>{ if(d?.url) setUrl(d.url); })
        .catch(()=>{});
    }
  }, [album.mbid]);
  if (url) return (
    <img src={url} alt={album.title}
      style={{width:px(size),height:px(size),borderRadius:px(radius),objectFit:"cover",flexShrink:0}}

/* Art cache keyed by "title::artist" so we never need fake MBIDs */
const _artCache = {};

function AlbumArt({color,size=44,radius=6,album=null}){
  // Cache key: prefer real mbid, fall back to "title::artist"
  const cacheKey = album?.mbid
    ? `mbid:${album.mbid}`
    : album?.title && album?.artist
      ? `ta:${album.title}::${album.artist}`.toLowerCase()
      : null;

  const [url,setUrl] = useState(album?.coverUrl || (cacheKey && _artCache[cacheKey]) || null);
  const [failed,setFailed] = useState(false);

  useEffect(()=>{
    if(url||failed||!API_BASE||!album?.title||!album?.artist) return;
    if(cacheKey && _artCache[cacheKey]){ setUrl(_artCache[cacheKey]); return; }

    // Use /api/resolve which searches MB by title+artist — guaranteed correct match
    const endpoint = album.mbid
      ? `${API_BASE}/api/cover/${album.mbid}`
      : `${API_BASE}/api/resolve?title=${encodeURIComponent(album.title)}&artist=${encodeURIComponent(album.artist)}`;

    fetch(endpoint)
      .then(r=>r.ok?r.json():null)
      .then(d=>{
        const imgUrl = d?.url || d?.coverUrl || null;
        if(imgUrl && cacheKey){
          _artCache[cacheKey]=imgUrl;
          setUrl(imgUrl);
        }
        // Also store the real mbid for future track lookups
        if(d?.releaseMbid && album && !album.mbid){
          album.mbid = d.releaseMbid;
        }
      })
      .catch(()=>{});
  },[cacheKey]);

  if(url && !failed) return (
    <img src={url} alt={album?.title||''}
      style={{width:px(size),height:px(size),borderRadius:px(radius),objectFit:"cover",flexShrink:0}}
      onError={()=>{ setFailed(true); }}/>
  );
  return <div style={{width:px(size),height:px(size),borderRadius:px(radius),
    background:color||album?.color||'#555',flexShrink:0,
    display:"flex",alignItems:"center",justifyContent:"center"}}>
    {size>40&&<span style={{fontSize:px(size*0.35),opacity:0.3}}>♪</span>}
  </div>;
}

function ScreenSearch({albums,onBack,onAlbum}){
  const [q,setQ]=useState("");
  const [genre,setGenre]=useState("All");
  const [results,setResults]=useState({artists:[],albums:[],tracks:[]});
  const [searching,setSearching]=useState(false);

  useEffect(()=>{
    if(q.length<2){ setResults({artists:[],albums:[],tracks:[]}); return; }
    const timer=setTimeout(async()=>{
      setSearching(true);
      try {
        // Run artist + album searches in parallel
        const [artistData, albumData] = await Promise.all([
          api(`/api/search?q=${encodeURIComponent(q)}&type=artist&limit=3`),
          api(`/api/search?q=${encodeURIComponent(q)}&type=release&limit=12`),
        ]);
        const apiArtists = artistData?.results || [];
        const apiAlbums  = albumData?.results?.map(r=>({
          id:r.mbid, mbid:r.mbid, title:r.title, artist:r.artist,
          year:parseInt(r.year)||0, tracks:r.tracks||12, genre:"Unknown",
          color:randomColor(r.mbid), avg:r.avg||null, myScore:r.myScore||null,
          myReview:r.myReview||"", ratings:r.ratings||0, coverUrl:r.coverUrl,
        })) || [];
        // Local fallback
        const localAlbums = albums.filter(a=>
          a.title.toLowerCase().includes(q.toLowerCase())||
          a.artist.toLowerCase().includes(q.toLowerCase()));
        const merged = apiAlbums.length ? apiAlbums : localAlbums;
        setResults({ artists:apiArtists, albums:merged, tracks:[] });
      } catch(e) {
        const local=albums.filter(a=>
          a.title.toLowerCase().includes(q.toLowerCase())||
          a.artist.toLowerCase().includes(q.toLowerCase()));
        setResults({artists:[],albums:local,tracks:[]});
      }
      setSearching(false);
    },400);
    return()=>clearTimeout(timer);
  },[q]);

  // deterministic colour from mbid string
  function randomColor(str){
    const colors=["#533ab7","#1D9E75","#D85A30","#378ADD","#BA7517","#D4537E","#1a3a5c","#5a4080","#8a3060","#2a5a7a"];
    let h=0; for(let i=0;i<(str||"").length;i++) h=(h*31+str.charCodeAt(i))&0xffff;
    return colors[h%colors.length];
  }

  const browseAlbums = albums.filter(a=>genre==="All"||a.genre===genre);
  const isSearching  = q.length >= 2;

  return <div style={{flex:1,overflowY:"auto",padding:"0 12px",background:C.bg}}>
    <div style={{marginTop:6,marginBottom:10}}>
      <div style={{display:"flex",alignItems:"center",gap:8,background:C.mid,borderRadius:10,
        padding:"10px 12px",border:`0.5px solid ${C.pink}44`}}>
        <span style={{fontSize:15,color:C.pink}}>🔍</span>
        <input autoFocus value={q} onChange={e=>setQ(e.target.value)}
          placeholder="Search artists, albums, songs..."
          style={{background:"none",border:"none",outline:"none",fontSize:11,color:C.white,flex:1}}/>
        {q&&<span onClick={()=>setQ("")} style={{color:C.gray,cursor:"pointer",fontSize:14}}>✕</span>}
      </div>
    </div>

    {!isSearching&&<>
      {/* Genre browse when not searching */}
      <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:8,marginBottom:8}}>
        {GENRES.map(g=><div key={g} onClick={()=>setGenre(g)}
          style={{flexShrink:0,background:genre===g?C.pink:C.psoft,
            border:`0.5px solid ${genre===g?C.pink:C.pink+"33"}`,
            borderRadius:20,padding:"5px 12px",fontSize:10,fontWeight:700,
            color:genre===g?C.white:C.pink,cursor:"pointer"}}>{g}</div>)}
      </div>
      <SectionHead>{genre==="All"?"All albums":genre}</SectionHead>
      {browseAlbums.map(a=><div key={a.id} onClick={()=>onAlbum(a)}
        style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",
          borderBottom:`0.5px solid ${C.border}`,cursor:"pointer"}}>
        <AlbumArt color={a.color} size={46} radius={6} album={a}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:11,fontWeight:700,color:C.white}}>{a.title}</div>
          <div style={{fontSize:9,color:C.gray}}>{a.artist} · {a.year}</div>
          <div style={{fontSize:9,color:"#555"}}>{a.genre}</div>
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}>
          {a.myScore&&<div style={{background:C.psoft,borderRadius:4,padding:"2px 6px",fontSize:9,fontWeight:700,color:C.pink}}>{a.myScore.toFixed(1)} you</div>}
          {a.avg&&<div style={{fontSize:11,fontWeight:700,color:"#888"}}>{a.avg}</div>}
        </div>
      </div>)}
    </>}

    {isSearching&&<>
      {searching&&<div style={{display:"flex",alignItems:"center",gap:8,padding:"16px 0",color:C.gray,fontSize:11}}>
        <span style={{fontSize:16}}>⏳</span> Searching MusicBrainz...
      </div>}

      {/* ARTISTS — shown first, prominent */}
      {!searching&&results.artists.length>0&&<>
        <SectionHead>Artists</SectionHead>
        {results.artists.map((a,i)=><div key={i} onClick={()=>onAlbum({id:a.mbid,mbid:a.mbid,title:a.name,artist:a.name,color:randomColor(a.mbid),isArtist:true})}
          style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:`0.5px solid ${C.border}`,cursor:"pointer"}}>
          <div style={{width:46,height:46,borderRadius:"50%",background:randomColor(a.mbid),
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:700,color:C.white,flexShrink:0}}>
            {a.name.slice(0,2).toUpperCase()}
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:12,fontWeight:700,color:C.white}}>{a.name}</div>
            <div style={{fontSize:9,color:C.gray}}>{a.genre||"Artist"}</div>
          </div>
          <div style={{background:C.psoft,borderRadius:4,padding:"3px 8px",fontSize:9,fontWeight:700,color:C.pink}}>Artist</div>
        </div>)}
      </>}

      {/* ALBUMS */}
      {!searching&&results.albums.length>0&&<>
        <SectionHead>Albums</SectionHead>
        {results.albums.map((a,i)=><div key={i} onClick={()=>onAlbum(a)}
          style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:`0.5px solid ${C.border}`,cursor:"pointer"}}>
          <AlbumArt color={a.color} size={46} radius={6} album={a}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:11,fontWeight:700,color:C.white}}>{a.title}</div>
            <div style={{fontSize:9,color:C.gray}}>{a.artist} · {a.year||""}</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}>
            {a.myScore!=null&&<div style={{background:C.psoft,borderRadius:4,padding:"2px 6px",fontSize:9,fontWeight:700,color:C.pink}}>{a.myScore.toFixed(1)} you</div>}
            {a.avg&&<div style={{fontSize:10,fontWeight:700,color:"#888"}}>{a.avg}</div>}
          </div>
        </div>)}
      </>}

      {!searching&&results.artists.length===0&&results.albums.length===0&&
        <div style={{textAlign:"center",color:C.gray,fontSize:12,marginTop:28}}>No results for "{q}"</div>}
    </>}
    <div style={{height:14}}/>
  </div>;
}

function randomColor(str){
  const colors=["#533ab7","#1D9E75","#D85A30","#378ADD","#BA7517","#D4537E","#1a3a5c","#5a4080","#8a3060","#2a5a7a"];
  let h=0; for(let i=0;i<(str||"").length;i++) h=(h*31+str.charCodeAt(i))&0xffff;
  return colors[h%colors.length];
}

/* ─── FRIEND REVIEW CARD (interactive reactions + comment thread) ─── */
function FriendReviewCard({fi,fr}){
  const emojiMap={fire:"🔥",cry:"😭",target:"🎯",skull:"💀",handshake:"🤝"};
  const [reactions,setReactions]=useState(fi.reactions);
  const [myReacts,setMyReacts]=useState({});
  const [comments,setComments]=useState(fi.comments);
  const [showComments,setShowComments]=useState(false);
  const toggleReact=(k)=>{
    const on=myReacts[k];
    setMyReacts(r=>({...r,[k]:!on}));
    setReactions(r=>({...r,[k]:(r[k]||0)+(on?-1:1)}));
  };
  return <div style={{padding:"6px 0",borderBottom:`0.5px solid ${C.border}`}}>
    <div style={{display:"flex",alignItems:"flex-start",gap:7}}>
      <Avatar initials={fr.initials} color={fr.color} size={21}/>
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:2}}>
          <span style={{fontSize:10,fontWeight:700,color:C.white}}>{fr.handle}</span>
          <span style={{fontSize:9,color:C.dgray}}>·</span>
          <span style={{fontSize:10,fontWeight:700,color:C.pink}}>{fi.score}</span>
        </div>
        <div style={{fontSize:10,color:"#aaa",lineHeight:1.4}}>{fi.text}</div>
        <div style={{display:"flex",alignItems:"center",gap:5,marginTop:5,flexWrap:"wrap"}}>
          {Object.entries(reactions).map(([k,v])=>{
            const on=myReacts[k];
            return <div key={k} onClick={()=>toggleReact(k)}
              style={{background:on?C.pdark:C.mid,border:`0.5px solid ${on?C.pink:"transparent"}`,
                borderRadius:20,padding:"2px 7px",fontSize:8,
                color:on?C.pink:"#777",cursor:"pointer",display:"flex",alignItems:"center",gap:3}}>
              {emojiMap[k]} {v}
            </div>;
          })}
          <div onClick={()=>setShowComments(!showComments)}
            style={{background:showComments?C.pdark:C.mid,border:`0.5px solid ${showComments?C.pink:"transparent"}`,
              borderRadius:20,padding:"2px 7px",fontSize:8,
              color:showComments?C.pink:"#777",cursor:"pointer",display:"flex",alignItems:"center",gap:3}}>
            💬 {comments.length}
          </div>
        </div>
      </div>
    </div>
    {showComments&&<div style={{marginLeft:28,marginTop:6}}>
      <CommentThread comments={comments}
        onAdd={text=>setComments(c=>[...c,{id:Date.now(),friendId:0,text,time:"just now"}])}/>
    </div>}
  </div>;
}

/* ─── ALBUM ─── */
function ScreenAlbum({album,albums,songsState,onBack,onSong,onRate,onRec,onFriend,onEditReview,onSaveAlbum,onArtist}){
  const [tab,setTab]=useState("Reviews");
  const [liked,setLiked]=useState({});
  // Live data fetched from API — overrides the stub passed in
  const [liveAlbum,setLiveAlbum]=useState(null);
  const [loadingTracks,setLoadingTracks]=useState(false);

  // mbid is only valid if it looks like a UUID (has dashes and right length)
  const looksLikeMbid = s => typeof s==='string' && s.length===36 && s.split('-').length===5;
  const mbid = looksLikeMbid(album.mbid) ? album.mbid : looksLikeMbid(album.id) ? album.id : null;

  useEffect(()=>{
    if(!API_BASE) return;
    setLoadingTracks(true);

    const load = async () => {
      try {
        // If we have a real mbid use it directly, otherwise resolve from title+artist
        let fetchMbid = mbid;
        if(!fetchMbid && album.title && album.artist){
          const resolved = await fetch(
            `${API_BASE}/api/resolve?title=${encodeURIComponent(album.title)}&artist=${encodeURIComponent(album.artist)}`
          ).then(r=>r.ok?r.json():null);
          fetchMbid = resolved?.releaseMbid || resolved?.mbid || null;
        }
        if(!fetchMbid){ setLoadingTracks(false); return; }

        const d = await fetch(`${API_BASE}/api/album/${fetchMbid}`)
          .then(r=>r.ok?r.json():null);
        if(d){ setLiveAlbum(d); }
      } catch(e){ console.error('album load:', e); }
      setLoadingTracks(false);
    };
    load();
  },[album.id]);

  // Use live data when available, fall back to stub
  const current = liveAlbum || album;
  // Tracks: use live tracklist, then local songsState, then local SONGS_DATA, then empty placeholders
  const localSongs = getSongs(album.id, songsState);
  const songs = (liveAlbum?.tracklist?.length ? liveAlbum.tracklist : localSongs) || [];
  const rated=songs.filter(s=>s.mine!==null).length;
  const topSong=songs.length?songs.reduce((a,b)=>(a.avg||0)>(b.avg||0)?a:b,songs[0]):null;
  const pubRevs=PUBLIC_REVIEWS[album.mbid||album.id]||PUBLIC_REVIEWS.default;
  const feedForAlbum=INIT_FEED.filter(f=>f.albumId===album.id);

  return <div style={{flex:1,display:"flex",flexDirection:"column",background:C.bg,overflow:"hidden"}}>
    <div style={{flexShrink:0,padding:"0 12px",background:C.bg}}>
      <BackRow label="Back" onBack={onBack}/>
      <div style={{display:"flex",gap:11,alignItems:"center",paddingBottom:10}}>
        <AlbumArt color={current.color||album.color} size={60} radius={8} album={current}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:14,fontWeight:700,color:C.white,lineHeight:1.2}}>{current.title}</div>
          <div style={{fontSize:10,color:C.gray,marginBottom:5}}>
            <span onClick={()=>onArtist&&onArtist(current.artist)} style={{color:C.pink,fontWeight:700,cursor:"pointer"}}>{current.artist}</span>
            {" · "}{current.year}{current.genre?" · "+current.genre:""}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:7}}>
            <span style={{fontSize:11,fontWeight:700,color:"#888"}}>{current.avg||"—"}</span>
            <span style={{fontSize:9,color:C.dgray}}>avg · {(current.ratings||0).toLocaleString()} ratings</span>
            {current.myScore!=null&&<div style={{background:C.psoft,borderRadius:5,padding:"2px 7px",fontSize:10,fontWeight:700,color:C.pink}}>
              {current.myScore.toFixed(1)} <span style={{fontSize:8,opacity:0.6}}>you</span></div>}
          </div>
        </div>
        <div onClick={onRec} style={{border:`0.5px solid ${C.pink}44`,borderRadius:8,
          padding:"7px 9px",display:"flex",flexDirection:"column",alignItems:"center",gap:2,cursor:"pointer",flexShrink:0}}>
          <span style={{fontSize:16,color:C.pink}}>↗</span>
          <span style={{fontSize:8,color:C.pink,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.06em"}}>Rec</span>
        </div>
      </div>
      {/* Your review — tappable to edit */}
      {current.myScore!=null
        ?<div onClick={onEditReview} style={{display:"flex",alignItems:"center",justifyContent:"space-between",
            background:C.psoft,borderRadius:8,padding:"8px 11px",marginBottom:9,cursor:"pointer",
            border:`0.5px solid ${C.pink}22`}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:8,fontWeight:700,color:C.pink,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:2}}>Your rating · tap to edit</div>
              <div style={{fontSize:9,color:"#888",fontStyle:"italic",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                {current.myReview||"No written review yet — add one?"}
              </div>
            </div>
            <div style={{display:"flex",alignItems:"baseline",gap:3,marginLeft:10}}>
              <span style={{fontSize:22,fontWeight:900,color:C.pink,fontFamily:"'Arial Black',Arial"}}>{current.myScore.toFixed(1)}</span>
              <span style={{fontSize:10,color:C.dgray}}>/10</span>
            </div>
          </div>
        :<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",
            background:C.card,borderRadius:8,padding:"8px 11px",marginBottom:9}}>
            <span style={{fontSize:11,color:C.gray}}>You haven't rated this yet</span>
            <div onClick={onRate} style={{background:C.pink,borderRadius:6,padding:"5px 12px",
              fontSize:10,fontWeight:700,color:C.white,textTransform:"uppercase",cursor:"pointer"}}>Rate it</div>
          </div>}
      <TabBar tabs={["Reviews","Tracklist"]} active={tab} onTab={setTab}/>
    </div>
    <div style={{flex:1,overflowY:"auto",padding:"0 12px"}}>
      {tab==="Reviews"?<>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"9px 0 5px"}}>
          <span style={{fontSize:9,fontWeight:700,color:C.gray,textTransform:"uppercase",letterSpacing:"0.1em"}}>Reviews</span>
          <span style={{fontSize:9,color:C.pink,fontWeight:700}}>most liked ↓</span>
        </div>
        {feedForAlbum.length>0&&<>
          <FeedDivider label="friends"/>
          {feedForAlbum.map((fi,i)=>{
            const fr=FRIENDS.find(f=>f.id===fi.friendId);
            if(!fr) return null;
            return <FriendReviewCard key={i} fi={fi} fr={fr}/>;
          })}
        </>}
        <FeedDivider label="everyone else"/>
        {pubRevs.map((r,i)=><div key={i} style={{display:"flex",alignItems:"flex-start",gap:7,padding:"5px 0",borderBottom:`0.5px solid ${C.border}`}}>
          <Avatar initials={r.initials} color={r.color} size={21}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:2}}>
              <span style={{fontSize:10,fontWeight:700,color:C.white}}>{r.handle}</span>
              <span style={{fontSize:9,color:C.dgray}}>·</span>
              <span style={{fontSize:10,fontWeight:700,color:C.pink}}>{r.score.toFixed(1)}</span>
            </div>
            <div style={{fontSize:10,color:"#aaa",lineHeight:1.4}}>{r.text}</div>
            <div style={{display:"flex",alignItems:"center",gap:4,marginTop:4}}>
              <span onClick={()=>setLiked(l=>({...l,[i]:!l[i]}))} style={{fontSize:11,cursor:"pointer"}}><span style={{color:liked[i]?C.pink:C.dgray,fontSize:13}}>♥</span></span>
              <span style={{fontSize:9,color:C.gray}}>{r.likes+(liked[i]?1:0)}</span>
              <span style={{fontSize:9,color:C.dgray,marginLeft:"auto"}}>like only</span>
            </div>
          </div>
        </div>)}
        <div style={{height:14}}/>
      </>:<>
        {loadingTracks&&<div style={{textAlign:"center",padding:"20px 0",color:C.gray}}>
          <div style={{fontSize:20,marginBottom:6}}>⏳</div>
          <div style={{fontSize:10}}>Loading tracks from MusicBrainz...</div>
        </div>}
        {!loadingTracks&&<>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 0 5px"}}>
          <span style={{fontSize:9,fontWeight:700,color:C.gray,textTransform:"uppercase",letterSpacing:"0.08em"}}>Songs</span>
          <span style={{fontSize:9,color:C.gray}}>{rated}/{songs.length} rated</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:8}}>

          <span style={{fontSize:8,fontWeight:700,color:C.dgray,textTransform:"uppercase",width:30,textAlign:"right"}}>Avg</span>
          <span style={{fontSize:8,fontWeight:700,color:C.pink,textTransform:"uppercase",width:30,textAlign:"right",opacity:0.6}}>You</span>
          <span style={{width:14,flexShrink:0}}/>
        </div>
        {songs.map((song,i)=>{
          const isTop=topSong&&song.id===topSong.id;
          return <div key={song.id} onClick={()=>onSong(song,album)}
            style={{display:"flex",alignItems:"center",gap:6,padding:"6px 0",
              borderBottom:`0.5px solid #161616`,cursor:"pointer"}}>
            <span style={{fontSize:9,color:C.dgray,width:14,textAlign:"right",flexShrink:0}}>{i+1}</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:10,fontWeight:700,color:isTop?C.pink:C.white,
                whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                {song.title}{isTop?" ★":""}
              </div>
              <div style={{fontSize:8,color:C.dgray}}>{song.dur}{song.myReview?<span style={{color:C.pink}}> · reviewed</span>:""}</div>

          </div>;
        })}
        <div style={{height:14}}/>
        </>}
      </>}
    </div>
  </div>;
}

/* ─── ARTIST PAGE ─── */
function ScreenArtist({artistMbid,artistName,onBack,onAlbum}){
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(true);
  const [tab,setTab]=useState("Albums");
  const [artistImg,setArtistImg]=useState(null);
  const [imgFailed,setImgFailed]=useState(false);
  const [resolvedMbid,setResolvedMbid]=useState(artistMbid||null);

  const colorFor=str=>{
    const cols=["#533ab7","#1D9E75","#D85A30","#378ADD","#BA7517","#D4537E","#1a3a5c","#5a4080","#8a3060","#2a5a7a"];
    let h=0;for(let i=0;i<(str||"").length;i++) h=(h*31+str.charCodeAt(i))&0xffff;
    return cols[h%cols.length];
  };

  useEffect(()=>{
    if(!API_BASE){ setLoading(false); return; }
    const load=async()=>{
      let mbid=artistMbid;
      // Search for artist MBID by name if not provided
      if(!mbid && artistName){
        try{
          // Try exact name search first
          const r=await fetch(`${API_BASE}/api/search?q=${encodeURIComponent(artistName)}&type=artist&limit=5`);
          if(r.ok){
            const d=await r.json();
            // Pick highest score result
            const best=d?.results?.sort((a,b)=>(b.score||0)-(a.score||0))?.[0];
            mbid=best?.mbid||null;
            if(mbid) setResolvedMbid(mbid);
          }
        } catch(e){ console.log('artist search error:',e); }
      }
      if(!mbid){
        console.log('No MBID found for artist:',artistName);
        setLoading(false);
        return;
      }
      try{
        const r=await fetch(`${API_BASE}/api/artist/${mbid}`);
        if(r.ok){
          const d=await r.json();
          setData(d);
        }
      } catch(e){ console.log('artist fetch error:',e); }
      setLoading(false);
    };
    load();
    // Wikipedia photo — non-blocking
    if(artistName && API_BASE){
      fetch(`${API_BASE}/api/artist-image?name=${encodeURIComponent(artistName)}`)
        .then(r=>r.ok?r.json():null)
        .then(d=>{if(d?.url)setArtistImg(d.url);})
        .catch(()=>{});
    }
  },[artistMbid,artistName]);

  const albums=data?.albums||[];
  const singles=data?.singles||[];
  const eps=data?.eps||[];
  const tabs=["Albums","Singles",...(eps.length>0?["EPs"]:[])];
  const currentList=tab==="Albums"?albums:tab==="Singles"?singles:eps;

  return <div style={{flex:1,display:"flex",flexDirection:"column",background:C.bg,overflow:"hidden"}}>
    <div style={{flexShrink:0,padding:"0 12px",background:C.bg}}>
      <BackRow label="Back" onBack={onBack}/>
      <div style={{display:"flex",gap:14,alignItems:"center",paddingBottom:12,
        borderBottom:`0.5px solid ${C.border}`}}>
        <div style={{width:72,height:72,borderRadius:"50%",overflow:"hidden",flexShrink:0,
          background:colorFor(resolvedMbid||artistName),
          display:"flex",alignItems:"center",justifyContent:"center",
          fontSize:24,fontWeight:700,color:"#fff"}}>
          {artistImg&&!imgFailed
            ?<img src={artistImg} alt={artistName||""}
               style={{width:"100%",height:"100%",objectFit:"cover"}}
               onError={()=>setImgFailed(true)}/>
            :(artistName||"?").slice(0,2).toUpperCase()}
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:20,fontWeight:700,color:C.white,lineHeight:1.1}}>{artistName||data?.name||"Artist"}</div>
          {data?.genre&&<div style={{fontSize:10,color:C.pink,marginTop:2,textTransform:"capitalize"}}>{data.genre}</div>}
          {data?.country&&<div style={{fontSize:10,color:C.gray,marginTop:1}}>{data.country}</div>}
          {!loading&&<div style={{fontSize:10,color:C.dgray,marginTop:4}}>
            {albums.length} albums · {singles.length} singles{eps.length>0?` · ${eps.length} EPs`:""}
          </div>}
        </div>
      </div>
      <TabBar tabs={tabs} active={tab} onTab={setTab}/>
    </div>
    <div style={{flex:1,overflowY:"auto",padding:"0 12px"}}>
      {loading&&<div style={{textAlign:"center",padding:"32px 0",color:C.gray}}>
        <div style={{fontSize:24,marginBottom:8}}>⏳</div>
        <div style={{fontSize:11}}>Loading artist from MusicBrainz...</div>
      </div>}
      {!loading&&!data&&
        <div style={{textAlign:"center",padding:"28px 0",color:C.gray,fontSize:11}}>
          <div style={{fontSize:20,marginBottom:8}}>🔍</div>
          <div>Could not find artist data</div>
          <div style={{fontSize:9,color:C.dgray,marginTop:4}}>Try searching for them in the Search tab</div>
        </div>}
      {!loading&&data&&currentList.length===0&&
        <div style={{textAlign:"center",padding:"28px 0",color:C.gray,fontSize:11}}>
          No {tab.toLowerCase()} found
        </div>}
      {!loading&&currentList.map((a,i)=>{
        const artistNameResolved=artistName||data?.name;
        const obj={id:a.mbid,mbid:a.mbid,title:a.title,
          artist:artistNameResolved,year:a.year,
          color:colorFor(a.mbid),
          // No coverUrl — AlbumArt will fetch via /api/resolve using title+artist
          avg:null,myScore:null,myReview:"",ratings:0,tracks:a.tracks||0};
        return <div key={i} onClick={()=>onAlbum(obj)}
          style={{display:"flex",alignItems:"center",gap:11,padding:"9px 0",
            borderBottom:`0.5px solid ${C.border}`,cursor:"pointer"}}>
          <AlbumArt color={colorFor(a.mbid)} size={52} radius={6} album={obj}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:11,fontWeight:700,color:C.white}}>{a.title}</div>
            <div style={{fontSize:9,color:C.gray}}>{a.year||"—"}</div>
          </div>
          {tab==="Singles"&&<div style={{background:C.mid,borderRadius:4,
            padding:"2px 7px",fontSize:8,color:C.gray,flexShrink:0}}>Single</div>}
          <span style={{fontSize:14,color:C.dgray}}>›</span>
        </div>;
      })}
      <div style={{height:14}}/>
    </div>
  </div>;
}

    <div style={{fontSize:9,fontWeight:700,color:C.gray,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>Badge</div>
    <div style={{display:"flex",gap:6,marginBottom:11}}>
      {[["hot","🔥 Hot take"],["outlier","📡 Outlier"],["none","Clean"]].map(([v,l])=>
        <div key={v} onClick={()=>setVariant(v)}
          style={{flex:1,background:variant===v?C.psoft:C.mid,
            border:variant===v?`1px solid ${C.pink}`:"1px solid transparent",
            borderRadius:8,padding:"7px 0",textAlign:"center",
            fontSize:9,fontWeight:700,color:variant===v?C.pink:C.gray,cursor:"pointer"}}>
          {l}
        </div>)}
    </div>
    {/* Card preview */}
    {cardAlbums.length===0
      ?<div style={{textAlign:"center",padding:"20px 0",color:C.gray,fontSize:11}}>
          {listType==="2026"?"No 2026 ratings yet — rate some albums first!":"Rate at least 1 album to generate your card"}
        </div>
      :<>
        <ShareCardPreview albums={cardAlbums} label={cardLabel} variant={variant}/>
        <div style={{display:"flex",gap:8,marginTop:11}}>
          <div style={{flex:1,background:C.mid,borderRadius:9,padding:"10px",textAlign:"center",
            fontSize:10,fontWeight:700,color:C.lgray,cursor:"pointer"}}>📋 Copy link</div>
          <div style={{flex:1,background:"#1a1a2e",borderRadius:9,padding:"10px",textAlign:"center",
            fontSize:10,fontWeight:700,color:"#9d8fff",cursor:"pointer"}}>📱 Instagram</div>
          <div style={{flex:1,background:"#100010",borderRadius:9,padding:"10px",textAlign:"center",
            fontSize:10,fontWeight:700,color:C.pink,cursor:"pointer"}}>🎵 TikTok</div>
        </div>
      </>}
  </Modal>;
}

/* ─── ROOT APP ─── */
function App(){
  const [albums,setAlbums]=useState(ALL_ALBUMS);
  const [songsState,setSongsState]=useState({});
  const [feed,setFeed]=useState(INIT_FEED);
  const [savedList,setSavedList]=useState([]); // "On my list" — albums saved from recs
  const [onboarded,setOnboarded]=useState(false);
  const [onboardStep,setOnboardStep]=useState(0);
  const [nav,setNav]=useState("home");
  const [stack,setStack]=useState([]);
  const [modal,setModal]=useState(null);
  /* Theme — dark/light/system */
  const [themeMode,setThemeMode]=useState("dark");
  const prefersDark = window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  const isDark = themeMode==="dark"||(themeMode==="system"&&prefersDark);
  Object.assign(C, isDark ? DARK_THEME : LIGHT_THEME);

  const push=(screen,props={})=>setStack(s=>[...s,{screen,props}]);
  const pop=()=>setStack(s=>s.slice(0,-1));
  const top=stack[stack.length-1];
  const handleNav=key=>{setNav(key);setStack([]);setModal(null);};

  /* 🔌 BACKEND: posts to API, always updates local state */
  const saveRating=(album,score,review)=>{
    const mbid=album.mbid||String(album.id);
    postRating(mbid,'album',score,review); // fire & forget
    setAlbums(prev=>{
      // Match on id OR mbid to catch both local and API-sourced albums
      const updated=prev.map(a=>
        (a.id===album.id||a.mbid===album.id||a.id===album.mbid||a.mbid===album.mbid)
          ?{...a,myScore:score,myReview:review}:a
      );
      // If album wasn't in local list (came from search/artist), add it
      const found=updated.some(a=>
        a.id===album.id||a.mbid===album.id||a.id===album.mbid||a.mbid===album.mbid
      );
      if(!found) return [...updated,{...album,myScore:score,myReview:review}];
      return updated;
    });
    setModal(null);
  };

  /* 🔌 BACKEND: posts song rating to API */
  const saveSong=(album,updatedSong)=>{
    const songMbid=updatedSong.mbid||String(updatedSong.id);
    postRating(songMbid,'song',updatedSong.mine,updatedSong.myReview);
    setSongsState(prev=>{
      // Save under every possible album key so lookup always finds it
      const keys=[album.id, album.mbid, String(album.id)].filter(Boolean);
      const next={...prev};
      keys.forEach(key=>{
        const existing=getSongs(key,prev);
        // Match by position id (integer) OR by mbid string
        const updated=existing.map(s=>
          (s.id===updatedSong.id || s.mbid===updatedSong.mbid)
            ? updatedSong : s
        );
        next[key]=updated;
      });
      return next;
    });
    pop();
  };

  /* 🔌 BACKEND HOOKUP: POST /api/feed/:id/comments */
  const saveToList=(albumId)=>{
    setSavedList(prev=>prev.includes(albumId)?prev:[...prev,albumId]);
  };
  const removeFromList=(albumId)=>{
    setSavedList(prev=>prev.filter(id=>id!==albumId));
  };
  const addComment=(feedId,text)=>{
    setFeed(prev=>prev.map(item=>item.id===feedId
      ?{...item,comments:[...item.comments,{id:Date.now(),friendId:0,text,time:"just now"}]}
      :item));
  };

  const openAlbum=album=>{const fresh=albums.find(a=>a.id===album.id)||album;push("album",{album:fresh});};
  const openSong=(song,album)=>push("song",{song,album});
  const openFriend=friend=>push("friend",{friend});
  const openArtist=(artistName,artistMbid)=>push("artist",{artistName,artistMbid:artistMbid||null});
  const openSearch=()=>push("search");
  const openRate=album=>setModal({type:"rate",album});
  const openRec=album=>setModal({type:"rec",album});
  const openShare=()=>setModal({type:"share"});
  const openSettings=()=>push("settings");

  const outerBg = isDark?"#111":"#d8d8da";
  if(!onboarded) return <PhoneShell outerBg={outerBg}>
    {onboardStep===0?<ScreenWelcome onNext={()=>setOnboardStep(1)}/>:<ScreenSeedTaste onDone={()=>setOnboarded(true)}/>}
  </PhoneShell>;

  const currentAlbum=top?.screen==="album"
    ?(albums.find(a=>
        a.id===top.props.album.id||
        a.mbid===top.props.album.id||
        a.id===top.props.album.mbid||
        a.mbid===top.props.album.mbid
      )||top.props.album)
    :null;

  const renderScreen=()=>{
    if(top) switch(top.screen){
      case "album": return <ScreenAlbum album={currentAlbum} albums={albums} songsState={songsState}
        onBack={pop} onSong={openSong} onRate={()=>openRate(currentAlbum)}
        onRec={()=>openRec(currentAlbum)} onFriend={openFriend}
        onEditReview={()=>openRate(currentAlbum)}
        onArtist={name=>openArtist(name,null)}/>;
      case "song": {
        // Look up the fresh song state across all possible album keys
        const albumId = top.props.album.id;
        const albumMbid = top.props.album.mbid;
        const songId = top.props.song.id;
        const songMbid = top.props.song.mbid;
        // Try to find updated song from songsState under any key
        let freshSong = null;
        for(const key of [albumId, albumMbid, String(albumId)].filter(Boolean)){
          const arr = songsState[key];
          if(arr){
            freshSong = arr.find(s=>s.id===songId||(songMbid&&s.mbid===songMbid));
            if(freshSong) break;
          }
        }
        freshSong = freshSong || top.props.song;
        return <ScreenSong song={freshSong} album={top.props.album} onBack={pop}
          onSaveSong={s=>saveSong(top.props.album,s)}/>;
      }
      case "friend": return <ScreenFriendProfile friend={top.props.friend} albums={albums} onBack={pop} onAlbum={openAlbum} onFriend={openFriend}/>;
      case "search": return <ScreenSearch albums={albums} onBack={pop}
        onAlbum={a=>{ pop(); if(a.isArtist) push("artist",{artistMbid:a.mbid,artistName:a.title}); else openAlbum(a); }}
        onArtist={(mbid,name)=>push("artist",{artistMbid:mbid,artistName:name})}/>;
      case "artist": return <ScreenArtist artistMbid={top.props.artistMbid} artistName={top.props.artistName}
        onBack={pop} onAlbum={openAlbum}/>;
      case "settings": return <ScreenSettings onBack={pop} themeMode={themeMode} setThemeMode={setThemeMode}/>;
      default: return null;
    }
    switch(nav){
      case "home": return <ScreenHome albums={albums} feed={feed} onAlbum={openAlbum} onSearch={openSearch} onFriend={openFriend} onUpdateFeed={addComment}/>;
      case "explore": return <ScreenExplore albums={albums} onAlbum={openAlbum} savedList={savedList} onSave={saveToList}/>;
      case "activity": return <ScreenActivity albums={albums} onAlbum={openAlbum} onFriend={openFriend}/>;
      case "profile": return <ScreenProfile albums={albums} onAlbum={openAlbum} onShareCard={openShare} onSettings={openSettings} savedList={savedList} onRemove={removeFromList}/>;
      default: return null;
    }
  };

  return <PhoneShell outerBg={outerBg}>
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",position:"relative"}}>
      {renderScreen()}
      {modal?.type==="rate"&&<ModalRating album={modal.album} onClose={()=>setModal(null)} onSave={(s,r)=>saveRating(modal.album,s,r)}/>}
      {modal?.type==="rec"&&<ModalRecommend album={modal.album} onClose={()=>setModal(null)}/>}
      {modal?.type==="share"&&<ModalShareCard albums={albums} onClose={()=>setModal(null)}/>}
    </div>
    <NavBar active={nav} onNav={handleNav}/>
  </PhoneShell>;
}

function PhoneShell({children}){
  return <div style={{width:"100vw",height:"100vh",background:"#111",display:"flex",alignItems:"center",justifyContent:"center"}}>
    <div className="phone-shell" style={{width:390,height:844,background:C.bg,borderRadius:44,border:"2.5px solid #333",
      overflow:"hidden",display:"flex",flexDirection:"column",boxShadow:"0 40px 100px rgba(0,0,0,0.7)",position:"relative"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",
        padding:"14px 22px 6px",flexShrink:0,background:C.bg}}>
        <span style={{fontSize:13,fontWeight:700,color:C.white}}>9:41</span>
        <div style={{width:110,height:8,background:"#111",borderRadius:4}}/>
        <span style={{fontSize:10,color:C.white,letterSpacing:2}}>▲ ● ■</span>
      </div>
      {children}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js')
      .then(r=>console.log('SW registered'))
      .catch(e=>console.log('SW failed:', e));
  });
}
</script>
</body>
